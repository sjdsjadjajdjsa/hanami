[package]
name = "hanami"
version = "0.1.2"
edition = "2024"
description = "A small game launcher with falling sakura petals"
license = "GPL-3.0-or-later"
repository = "https://github.com/sjdsjadjajdjsa/hanami"
homepage = "https://hanami.lilygrove.dev"
publish = false

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "system-tray", "unstable-winit-030"] }
desktop = { path = "../desktop" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
steamlocate = "2.1"
global-hotkey = "0.8"
open = { version = "5", features = ["shellexecute-on-windows"] }
interprocess = "2"
serde_json = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-femtovg"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"
