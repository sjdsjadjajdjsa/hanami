# Known game ports, recomps and rewrites that Hanami finds by itself.
# Hanami ships this list and fetches the newest copy from GitHub once a day;
# the higher version wins. docs/PORTS.md says how to add a port.
#
# Each [[port]]:
#   name     the name shown in the panel: the same one the port's own
#            .desktop file (or Flatpak) uses, so the two merge into one row
#   url      the project page
#   linux    program file names on Linux, case doesn't matter, * matches
#            anything; the file must be executable
#   windows  program file names on Windows
#   flatpak  Flatpak app ids, started with `flatpak run <id>`
#   beside   optional: a file that has to sit next to the program, any one of
#            them, for programs with everyday names
version = 1

[[port]]
name = "Ship of Harkinian"
url = "https://www.shipofharkinian.com/"
linux = ["soh.appimage", "SoH-*.appimage", "soh.elf"]
windows = ["soh.exe"]

