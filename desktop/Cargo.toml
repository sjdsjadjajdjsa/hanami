[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
description = "Desktop glue Hanami needs that the toolkit does not provide"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
