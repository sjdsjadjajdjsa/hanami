name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libwayland-dev libdbus-1-dev libudev-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The installer script is otherwise only compiled when a release is
      # tagged; packing stand-in files checks it (and its [Code]) here.
      - name: Installer script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/hanami -Force | Out-Null
          Copy-Item README.md, GUIDE.md, LICENSE dist/hanami/
          New-Item -ItemType File dist/hanami/hanami.exe | Out-Null
          iscc /Q "/DSource=$env:GITHUB_WORKSPACE\dist\hanami" packaging\windows\hanami.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
