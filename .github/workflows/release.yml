name: release

# Push a tag like v0.1.0 and this builds Hanami for Linux (tar.gz and
# AppImage) and Windows (installer and zip) and puts the downloads on the
# GitHub release for that tag. The tag must match the version in
# hanami/Cargo.toml: the installer and the update check both use it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux build runs on the oldest Ubuntu LTS still supported: a
          # binary needs the glibc it was built against or newer, so this
          # sets the oldest system it runs on (glibc 2.35).
          - os: ubuntu-24.04
            container: ubuntu:22.04
            assets: |
              hanami-linux-x86_64.tar.gz
              hanami-x86_64.AppImage
          - os: windows-latest
            assets: |
              hanami-windows-x86_64.zip
              hanami-setup-x86_64.exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Before checkout: the bare container has no git or curl.
      - name: System libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config file patchelf libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libwayland-dev libdbus-1-dev libudev-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the tag against Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' hanami/Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG but hanami/Cargo.toml says $version"
            exit 1
          fi
      - run: cargo build --release --package hanami
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/hanami
          cp target/release/hanami README.md GUIDE.md LICENSE dist/hanami/
          tar czf hanami-linux-x86_64.tar.gz -C dist hanami
          packaging/linux/appimage.sh target/release/hanami hanami-x86_64.AppImage
          ./hanami-x86_64.AppImage --appimage-extract-and-run --help
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/hanami -Force | Out-Null
          Copy-Item target/release/hanami.exe, README.md, GUIDE.md, LICENSE dist/hanami/
          Compress-Archive -Path dist/hanami -DestinationPath hanami-windows-x86_64.zip
          $version = $env:TAG.TrimStart("v")
          iscc /Q "/DVersion=$version" "/DSource=$env:GITHUB_WORKSPACE\dist\hanami" packaging\windows\hanami.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.assets }}

  # Checksums let anyone confirm a download arrived whole; the signed build
  # record proves the files were built here from this tag:
  #   gh attestation verify hanami-x86_64.AppImage -R sjdsjadjajdjsa/hanami
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum hanami-* | tee SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-checksums: SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # A release published on github.com makes the tag itself; then the
        # downloads are added to it instead.
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" hanami-* SHA256SUMS --repo "$REPO" --clobber
          else
            gh release create "$TAG" hanami-* SHA256SUMS --repo "$REPO" --title "Hanami $TAG" --generate-notes
          fi
