name: audit

# Checks every dependency against the RustSec list of known security
# problems: whenever the dependencies change, and once a week for new reports.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, "**/Cargo.toml"]
  pull_request:
    paths: [Cargo.lock, "**/Cargo.toml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit
      - run: cargo audit
