name: An idea
description: Something Hanami could do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Hanami tries to stay small and light. [SPEC.md](https://github.com/sjdsjadjajdjsa/hanami/blob/main/docs/SPEC.md) says what it does and leaves out, and [ROADMAP.md](https://github.com/sjdsjadjajdjsa/hanami/blob/main/docs/ROADMAP.md) what is already planned.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What you'd do with it, in a few plain lines.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
