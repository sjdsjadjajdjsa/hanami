    .area { fill: #f4b6c8; fill-opacity: 0.11; }
    .line, .whisker { stroke: #f4b6c8; }
    .dot { fill: #f4b6c8; } .last-dot { fill: #f4b6c8; stroke: #17141d; stroke-width: 2; }
    .pill { fill: #f4b6c8; fill-opacity: 0.14; } .last { fill: #f4b6c8; }
